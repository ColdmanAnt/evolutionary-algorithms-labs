name: Проверка лабораторных

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Тесты и сохранённые результаты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7
      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Установить зависимости
        run: python -m pip install -r requirements-dev.txt
      - name: Проверить код, серии запусков и PDF
        run: python tools/verify_bundle.py --replay
      - name: Сохранить протоколы этой проверки
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.sha }}
          path: |
            verification.json
            lab1/audit.json
            lab2/audit.json
            lab3/audit.json
            lab4/audit.json
          if-no-files-found: error
          retention-days: 14
